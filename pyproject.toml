[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosspix"
version = "0.2.0"
description = "Cross-platform photo synchronization across Google Photos, Ente, Immich, and local folders."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Philippe Guglielmetti (goulu)"}
]
keywords = ["photos", "sync", "google-photos", "ente", "immich", "backup", "exif"]
dependencies = [
    "immichpy>=0.1.0",
    "gphotospy>=0.2.1",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "PyNaCl>=1.5.0",
    "Pillow>=10.0.0",
    "piexif>=1.1.3",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crosspix = "crosspix.cli:main"

[project.urls]
Homepage = "https://github.com/goulu/crosspix"
Repository = "https://github.com/goulu/crosspix"

[tool.setuptools.packages.find]
where = ["."]
include = ["crosspix*"]
